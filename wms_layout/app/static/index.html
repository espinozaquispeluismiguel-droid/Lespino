<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#A6192E">
  <title>WMS Layout · Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- app.css antes que tailwind.css: las utilidades (colores, bordes) prevalecen sobre .card/.btn -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">
  <header id="topbar" class="hidden bg-marca-600 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-4">
      <a href="#/" class="font-bold tracking-tight text-lg whitespace-nowrap">WMS<span class="font-normal opacity-80"> · Inventario</span></a>
      <nav id="nav" class="hidden md:flex gap-1 text-sm"></nav>
      <div class="ml-auto flex items-center gap-3 text-sm">
        <span id="user-label" class="hidden sm:inline opacity-90"></span>
        <button id="btn-logout" class="px-3 py-1.5 rounded bg-white/15 hover:bg-white/25">Salir</button>
        <button id="btn-menu" class="md:hidden px-2 py-1.5 rounded bg-white/15" aria-label="Menú">☰</button>
      </div>
    </div>
    <nav id="nav-mobile" class="md:hidden hidden flex-col px-4 pb-3 gap-1 text-sm"></nav>
  </header>

  <main id="view" class="max-w-7xl mx-auto px-4 py-6"></main>

  <div id="toasts" class="fixed bottom-4 right-4 left-4 sm:left-auto flex flex-col gap-2 z-50 items-end"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
